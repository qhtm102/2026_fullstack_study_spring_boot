spring.application.name=imageboard

# MariaDB 데이터소스 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/imageboard?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=human
spring.datasource.password=human
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update                   
spring.jpa.show-sql=true                               
spring.jap.properties.hibernate.format_sql=true        

spring.thymeleaf.cache = false

server.port=8080
